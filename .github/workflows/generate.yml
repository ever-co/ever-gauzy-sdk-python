name: Generate SDK

on:
  workflow_dispatch:
  repository_dispatch:
    types: [spec-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ever-k8s-linux-x64-4
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Kiota
        run: dotnet tool install --global Microsoft.OpenApi.Kiota

      - name: Generate SDK
        run: |
          kiota generate \
            --openapi https://api.gauzy.co/swg-json \
            --language Python \
            --class-name EverGauzyApiClient \
            --namespace-name ever_gauzy_sdk \
            --output ./src/ever_gauzy_sdk \
            --clean-output

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & test
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v || echo "No tests yet"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: 'chore: regenerate SDK from latest API spec'
          branch: sdk/regenerate
          commit-message: 'chore: regenerate SDK from latest API spec'
          body: |
            Auto-generated SDK update from the latest Gauzy API OpenAPI spec.

            Source: https://api.gauzy.co/swg-json
